<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Testi</title>
    
    <!-- Firebase SDK (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #d93025; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background-color: var(--bg); margin: 0; padding: 10px; }
        
        /* Üst Panel */
        .stats { display: flex; justify-content: space-around; background: white; padding: 15px; border-bottom: 3px solid #ddd; font-size: 24px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .timer { color: var(--danger); }
        .score { color: var(--primary); }

        #game-area { display: none; margin-top: 20px; }
        #start-screen { margin-top: 100px; }
        .word-display { font-size: 60px; font-weight: 800; color: var(--primary); margin: 15px 0; }
        
        /* 4 Seçenekli Kart Düzeni */
        .options-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
        .card-box { width: 260px; height: 260px; background: white; border: 8px solid white; border-radius: 25px; cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,0.1); transition: 0.3s; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-box:hover { transform: scale(1.05); border-color: var(--success); }
        .card-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Butonlar */
        .btn { padding: 15px 30px; font-size: 20px; border-radius: 10px; border: none; cursor: pointer; transition: 0.3s; margin: 10px; }
        .btn-start { background: var(--primary); color: white; }
        .btn-leaderboard { background: #607d8b; color: white; }
        .btn-restart { background: var(--success); color: white; }

        /* Overlay Ekranlar */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: white; z-index: 200; padding-top: 30px; overflow-y: auto; }
        .leaderboard-table { width: 90%; max-width: 400px; margin: 20px auto; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: left; }
        .entry { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 18px; }
        .entry b { color: #ffca28; }
    </style>
</head>
<body>

    <!-- Başlangıç Ekranı -->
    <div id="start-screen">
        <h1 style="color: var(--primary);">Hoşgeldiniz</h1>
        <p id="loading-msg">Dosyalar kontrol ediliyor... 🌍</p>
        <div id="start-controls" style="display: none;">
            <button class="btn btn-start" onclick="startGame()">Oyunu Başlat</button>
            <button class="btn btn-leaderboard" onclick="openLeaderboard()">Sıralamayı Gör</button>
        </div>
    </div>

    <!-- Oyun Alanı -->
    <div id="game-area">
        <div class="stats">
            <div class="score">Puan: <span id="score-val">0</span></div>
            <div class="timer">Süre: <span id="time-val">30</span></div>
        </div>
        <div class="word-display" id="target-word">...</div>
        <div class="options-container" id="options-container"></div>
    </div>

    <!-- Bitiş Ekranı -->
    <div id="end-screen" class="overlay">
        <h1>Oyun Bitti! 🏁</h1>
        <h2 id="final-score-text">Puanınız: 0</h2>
        <div class="leaderboard-table">
            <h3 style="text-align: center; color: #ffca28;">🌍 DÜNYA SIRALAMASI</h3>
            <div id="leaderboard-list">Liderler getiriliyor...</div>
        </div>
        <button class="btn btn-restart" onclick="location.reload()">Tekrar Oyna</button>
    </div>

    <!-- Sadece Sıralama Ekranı -->
    <div id="only-leaderboard" class="overlay">
        <h2 style="margin-top: 50px;">Global Sıralama</h2>
        <div class="leaderboard-table">
            <div id="only-list">Yükleniyor...</div>
        </div>
        <button class="btn btn-restart" onclick="document.getElementById('only-leaderboard').style.display='none'">Kapat</button>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // --- FİREBASE BİLGİLERİN ---
        const firebaseConfig = {
            apiKey: "AIzaSyDRWyLsIvcu5szx4m-fRNGAopapWgCYDIo",
            authDomain: "wordgame-955de.firebaseapp.com",
            projectId: "wordgame-955de",
            databaseURL: "https://wordgame-955de-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "wordgame-955de.firebasestorage.app",
            messagingSenderId: "444110230727",
            appId: "1:444110230727:web:e465b9139b7de867561ae2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- GITHUB BİLGİLERİN ---
        const GITHUB_USER = "yudegi"; 
        const REPO_NAME = "wordgame";
        const BRANCH = "main";

        let wordList = [], currentWord = null, score = 0, timeLeft = 30, gameActive = false;

        // Sistemi Başlat ve Dosyaları Çek
        async function loadFiles() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`);
                const files = await res.json();
                let data = {};

                files.forEach(f => {
                    const parts = f.name.split('.');
                    if (parts.length > 1) {
                        const ext = parts.pop().toLowerCase();
                        const name = parts.join('.').toLowerCase();
                        if (!data[name]) data[name] = { id: name };
                        const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${f.name}`;
                        if (['png', 'jpg', 'jpeg'].includes(ext)) data[name].img = url;
                        if (ext === 'mp3') data[name].audio = url;
                    }
                });

                wordList = Object.values(data).filter(i => i.img && i.audio);
                if (wordList.length >= 4) {
                    document.getElementById('loading-msg').innerText = "Kelimeler başarıyla yüklendi.";
                    document.getElementById('start-controls').style.display = 'block';
                } else {
                    document.getElementById('loading-msg').innerText = "Hata: En az 4 farklı kelime yüklemeniz gerekiyor.";
                }
            } catch (e) { document.getElementById('loading-msg').innerText = "Hata: Bağlantı kurulamadı!"; }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            gameActive = true;
            runTimer();
            nextRound();
        }

        function runTimer() {
            const timer = setInterval(() => {
                if (!gameActive) return clearInterval(timer);
                timeLeft--;
                document.getElementById('time-val').innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(timer); stopGame(); }
            }, 1000);
        }

        function nextRound() {
            if (!gameActive) return;
            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            
            // Formatlama: İlk harf Büyük, diğerleri küçük
            const formattedName = currentWord.id.charAt(0).toUpperCase() + currentWord.id.slice(1).toLowerCase();
            document.getElementById('target-word').innerText = formattedName;
            
            const player = document.getElementById('audio-player');
            player.src = currentWord.audio;
            player.play().catch(() => {});

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // 4 Seçenek Oluştur
            let choices = [...wordList].sort(() => 0.5 - Math.random()).slice(0, 4);
            if (!choices.find(c => c.id === currentWord.id)) choices[0] = currentWord;
            
            choices.sort(() => 0.5 - Math.random()).forEach(c => {
                const div = document.createElement('div');
                div.className = 'card-box';
                div.innerHTML = `<img src="${c.img}">`;
                div.onclick = () => {
                    if (c.id === currentWord.id) {
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        nextRound();
                    } else {
                        score = Math.max(0, score - 10); // Eksi 10 puan (0'ın altına düşmez)
                        document.getElementById('score-val').innerText = score;
                        alert("Yanlış! -10 Puan");
                    }
                };
                container.appendChild(div);
            });
        }

        function stopGame() {
            gameActive = false;
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('final-score-text').innerText = "Puanınız: " + score;
            
            const studentName = prompt("Rekorunu kaydetmek için ismini yaz:", "Öğrenci");
            if (studentName) {
                database.ref('global_scores').push({ name: studentName, score: score, timestamp: Date.now() });
            }
            updateLeaderboard('leaderboard-list');
        }

        function openLeaderboard() {
            document.getElementById('only-leaderboard').style.display = 'block';
            updateLeaderboard('only-list');
        }

        function updateLeaderboard(elementId) {
            database.ref('global_scores').orderByChild('score').limitToLast(10).once('value', (snap) => {
                let items = [];
                snap.forEach(child => { items.push(child.val()); });
                const listHtml = items.reverse().map((s, i) => 
                    `<div class="entry"><span>${i+1}. ${s.name}</span><b>${s.score}</b></div>`
                ).join('');
                document.getElementById(elementId).innerHTML = listHtml || "Henüz rekor yok!";
            });
        }

        loadFiles();
    </script>
</body>
</html>
