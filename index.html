<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusuf Hoca - GLOBAL Kelime Avcıları</title>
    
    <!-- Firebase SDK (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background-color: var(--bg); margin: 0; padding: 10px; }
        
        /* Üst Panel */
        .stats { display: flex; justify-content: space-around; background: white; padding: 15px; border-bottom: 3px solid #ddd; font-size: 24px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .timer { color: #d93025; }
        .score { color: #1a73e8; }

        #game-area { display: none; margin-top: 20px; }
        .word-display { font-size: 60px; font-weight: 800; color: var(--primary); margin: 15px 0; text-transform: uppercase; }
        
        /* Kart Düzenlemesi */
        .options-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
        .card-box { width: 280px; height: 280px; background: white; border: 8px solid white; border-radius: 25px; cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,0.1); transition: 0.3s; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-box:hover { transform: scale(1.05); border-color: var(--success); }
        .card-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Global Leaderboard Ekranı */
        #end-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: white; z-index: 200; padding-top: 30px; overflow-y: auto; }
        .leaderboard-table { width: 380px; margin: 20px auto; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: left; }
        .entry { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 18px; }
        .entry b { color: #ffca28; }
        .btn-restart { background: var(--success); color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 10px; cursor: pointer; margin-bottom: 40px; }
    </style>
</head>
<body>

    <div id="loading-msg">Sistem Yükleniyor... 🌍</div>

    <div id="game-area">
        <div class="stats">
            <div class="score">Puan: <span id="score-val">0</span></div>
            <div class="timer">Süre: <span id="time-val">30</span></div>
        </div>
        <div class="word-display" id="target-word">...</div>
        <div class="options-container" id="options-container"></div>
    </div>

    <div id="end-screen">
        <h1>Süre Bitti! 🏁</h1>
        <h2 id="final-score-text">Puanınız: 0</h2>
        <div class="leaderboard-table">
            <h3 style="text-align: center; color: #ffca28;">🌍 DÜNYA SIRALAMASI</h3>
            <div id="leaderboard-list">Liderler getiriliyor...</div>
        </div>
        <button class="btn-restart" onclick="location.reload()">Yeni Yarışma Başlat</button>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // --- SENİN FİREBASE BİLGİLERİN ---
        const firebaseConfig = {
            apiKey: "AIzaSyDRWyLsIvcu5szx4m-fRNGAopapWgCYDIo",
            authDomain: "wordgame-955de.firebaseapp.com",
            projectId: "wordgame-955de",
            databaseURL: "https://wordgame-955de-default-rtdb.europe-west1.firebasedatabase.app", // Not: Realtime Database URL'sini buraya ekledim
            storageBucket: "wordgame-955de.firebasestorage.app",
            messagingSenderId: "444110230727",
            appId: "1:444110230727:web:e465b9139b7de867561ae2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // GitHub Bilgilerin
        const GITHUB_USER = "yudegi"; 
        const REPO_NAME = "wordgame";
        const BRANCH = "main";

        let wordList = [], currentWord = null, score = 0, timeLeft = 30, gameActive = false;

        async function startSystem() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`);
                const files = await res.json();
                let data = {};

                files.forEach(f => {
                    const parts = f.name.split('.');
                    if (parts.length > 1) {
                        const ext = parts.pop().toLowerCase();
                        const name = parts.join('.').toLowerCase();
                        if (!data[name]) data[name] = { id: name };
                        const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${f.name}`;
                        if (['png', 'jpg', 'jpeg'].includes(ext)) data[name].img = url;
                        if (ext === 'mp3') data[name].audio = url;
                    }
                });

                wordList = Object.values(data).filter(i => i.img && i.audio);
                if (wordList.length > 0) {
                    document.getElementById('loading-msg').style.display = 'none';
                    document.getElementById('game-area').style.display = 'block';
                    gameActive = true;
                    runTimer();
                    nextRound();
                }
            } catch (e) { document.getElementById('loading-msg').innerText = "Hata: Dosyalar çekilemedi!"; }
        }

        function runTimer() {
            const timer = setInterval(() => {
                if (!gameActive) return clearInterval(timer);
                timeLeft--;
                document.getElementById('time-val').innerText = timeLeft;
                if (timeLeft <= 0) { clearInterval(timer); stopGame(); }
            }, 1000);
        }

        function nextRound() {
            if (!gameActive) return;
            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('target-word').innerText = currentWord.id;
            
            const player = document.getElementById('audio-player');
            player.src = currentWord.audio;
            player.play().catch(() => {});

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            let choices = [...wordList].sort(() => 0.5 - Math.random()).slice(0, 3);
            if (!choices.find(c => c.id === currentWord.id)) choices[0] = currentWord;
            choices.sort(() => 0.5 - Math.random()).forEach(c => {
                const div = document.createElement('div');
                div.className = 'card-box';
                div.innerHTML = `<img src="${c.img}">`;
                div.onclick = () => {
                    if (c.id === currentWord.id) {
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        nextRound();
                    }
                };
                container.appendChild(div);
            });
        }

        function stopGame() {
            gameActive = false;
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('final-score-text').innerText = "Puanınız: " + score;
            
            const studentName = prompt("Rekorunu kaydetmek için ismini yaz Yusuf hocam:", "Öğrenci");
            if (studentName) {
                database.ref('global_scores').push({
                    name: studentName,
                    score: score,
                    timestamp: Date.now()
                });
            }
            updateLeaderboard();
        }

        function updateLeaderboard() {
            database.ref('global_scores').orderByChild('score').limitToLast(10).once('value', (snap) => {
                let items = [];
                snap.forEach(child => { items.push(child.val()); });
                const listHtml = items.reverse().map((s, i) => 
                    `<div class="entry"><span>${i+1}. ${s.name}</span><b>${s.score}</b></div>`
                ).join('');
                document.getElementById('leaderboard-list').innerHTML = listHtml || "Henüz rekor kırılmadı!";
            });
        }

        startSystem();
    </script>
</body>
</html>
